name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # Placeholders only — real values are set in CodeBuild. This job
          # proves the bundle compiles, not that it can reach anything.
          VITE_API_URL: https://api.example.com
          VITE_COGNITO_USER_POOL_ID: ap-south-1_ciplaceholder
          VITE_COGNITO_CLIENT_ID: ci-placeholder-client-id

      - name: No secret may be compiled into the public bundle
        working-directory: frontend
        run: |
          # VITE_ variables are inlined by Vite, so a key set as VITE_OPENAI_API_KEY
          # ends up readable by every user. This is how the previous key leaked.
          if grep -rlE 'sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}' dist/ ; then
            echo "::error::A credential was found in the built bundle."
            exit 1
          fi
          echo "No credentials found in dist/."

  check-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax-check backend sources
        working-directory: backend
        run: |
          for f in $(find . -name '*.js' -not -path './node_modules/*'); do
            node --check "$f"
          done

  check-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check operational scripts
        working-directory: scripts
        run: |
          for f in *.js; do node --check "$f"; done
