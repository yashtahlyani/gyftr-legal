server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Two real pages, not a single-page app: /app must serve app.html, and
  # anything unknown falls back to the login page rather than 404ing.
  location = /app     { try_files /app.html =404; }
  location = /app.html { try_files /app.html =404; }
  location /          { try_files $uri $uri/ /index.html; }

  # Hashed asset filenames change every build, so they can cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The HTML entry points must never be cached, or users keep running the old
  # bundle after a deploy — which looks exactly like the fix not working.
  location ~ ^/(index|app)\.html$ {
    add_header Cache-Control "no-store, must-revalidate";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
